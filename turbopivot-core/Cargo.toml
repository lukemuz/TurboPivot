[package]
name = "turbopivot-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
polars = { version = "0.41.0", features = [
    "lazy",
    "temporal",
    "describe",
    "json",
    "parquet",
    "dtype-datetime",
    "dtype-struct",
    "strings",
    "random",
    "object",
    "fmt",
    "performant",
    "pivot",
] }
thiserror = "2.0.11"
polars-ops = { version = "0.41.0", features = ["pivot"] }
